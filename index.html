<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown Timer Ultra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg-animation"></div>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card glassmorph p-4 shadow-lg rounded-4 text-center animate-fadein">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="m-0">Countdown Timer</h1>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="darkModeSwitch" />
          <label class="form-check-label" for="darkModeSwitch">Dark</label>
        </div>
      </div>

      <input type="number" class="form-control mb-3" id="secondsInput" placeholder="Inserisci i secondi" min="1" />

      <div class="d-flex justify-content-between gap-2 mb-3">
        <button id="startBtn" class="btn btn-success flex-fill">Avvia</button>
        <button id="pauseBtn" class="btn btn-warning flex-fill">Pausa</button>
        <button id="resetBtn" class="btn btn-danger flex-fill">Reset</button>
      </div>

      <div class="progress mb-3" style="height: 20px">
        <div class="progress-bar progress-bar-striped bg-primary" id="progressBar" style="width: 0%"></div>
      </div>

      <svg id="circleTimer" width="140" height="140" class="mb-3">
        <circle cx="70" cy="70" r="60" stroke="#ccc" stroke-width="10" fill="none" />
        <circle id="circleProgress" cx="70" cy="70" r="60" stroke="#0d6efd" stroke-width="10" fill="none"
          stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" />
        <text x="50%" y="55%" text-anchor="middle" fill="#333" font-size="24px" id="svgText">00:00</text>
      </svg>

      <div id="display" class="display-4 fw-bold text-primary">00:00</div>
    </div>
  </div>

  <div class="modal fade" id="endModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glassmorph p-3 text-center">
        <h4 class="mb-3">⏰ Tempo Scaduto!</h4>
        <button class="btn btn-primary" data-bs-dismiss="modal">Riprova</button>
      </div>
    </div>
  </div>

  <audio id="alarmSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>

<!-- CAOCCI_LAB_CREDIT_2026_11_08 -->

</body>
</html>
